name: Quality and PostgreSQL qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      load_records:
        description: "Optional measured load profile (0 disables; maximum 10000)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: mdm-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.16"
  UV_VERSION: "0.13.6"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  DO_NOT_TRACK: "1"

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select meaningful qualification work
        id: changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          event_name = os.environ["GITHUB_EVENT_NAME"]
          pr = event.get("pull_request", {})
          pr_head = pr.get("head", {}).get("sha", "")
          force_runtime = event_name == "workflow_dispatch"
          if event_name == "pull_request" and event.get("action") == "synchronize":
              # The previous push head, not the PR base, makes a later docs-only
              # commit incremental even when the whole PR introduces runtime code.
              base, head = event.get("before", ""), event.get("after", "")
              selection = "incremental-pr-push"
              if head != pr_head:
                  force_runtime = True
                  selection = "inconsistent-pr-head-full-qualification"
          elif event_name == "pull_request":
              base, head = pr.get("base", {}).get("sha", ""), pr_head
              selection = "full-pr-diff"
          else:
              base, head = event.get("before", ""), event.get("after") or os.environ["GITHUB_SHA"]
              selection = "branch-push-diff"
          def available_commit(value):
              return bool(re.fullmatch(r"[0-9a-f]{40}", value or "")) and set(value) != {"0"} and subprocess.run(
                  ["git", "cat-file", "-e", value + "^{commit}"], capture_output=True
              ).returncode == 0
          changed = []
          if force_runtime:
              selection = "manual-full-qualification" if event_name == "workflow_dispatch" else selection
          elif available_commit(base) and available_commit(head):
              changed = subprocess.check_output([
                  "git", "diff", "--no-ext-diff", "--no-renames", "--name-only", "-z", base, head, "--"
              ]).decode("utf-8", "surrogateescape").split("\0")
              changed = [path for path in changed if path]
          else:
              # A force-push may make the previous head unreachable. Unknown
              # change scope must never silently suppress runtime qualification.
              force_runtime = True
              selection = "unavailable-reference-full-qualification"
          prefixes = ("src/", "tests/", "dbt/", "contracts/", "data/", "migrations/", "scripts/", ".github/", "infra/", "observability/")
          runtime = force_runtime or any(
              path.startswith(prefixes) or path in {"pyproject.toml", "uv.lock", "Dockerfile", "compose.yaml", ".dockerignore"}
              for path in changed
          )
          print(json.dumps({"selection": selection, "runtime": runtime, "changed_paths": len(changed)}))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("runtime=" + str(runtime).lower() + "\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as output:
                  output.write("### Qualification selection\n\n")
                  output.write(f"Selection: `{selection}`. Changed paths inspected: {len(changed)}.\n\n")
                  output.write("Runtime qualification requested.\n\n" if runtime else "Documentation/evidence changes only; runtime qualification not requested.\n\n")
                  output.write("This is a scheduling decision, not a qualification result.\n")
          PY
      - name: Scan publishable files and Git history
        run: python3 scripts/secret_scan.py --history --output artifacts/secret-scan.json
      - name: Retain scan result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-${{ github.sha }}
          path: artifacts/secret-scan.json
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the exact reviewed lock
        run: uv sync --frozen --all-extras
      - name: Retain installed component and license declarations
        run: uv run --no-sync python scripts/component_inventory.py --check --output artifacts/components.json
      - name: Audit installed dependencies against published advisories
        run: |
          uv export --frozen --all-extras --no-emit-project --no-hashes --output-file artifacts/audit-requirements.txt
          uv run --no-sync pip-audit --strict --disable-pip --no-deps -r artifacts/audit-requirements.txt --progress-spinner off --timeout 20 --format json --output artifacts/dependency-audit.json
      - name: Retain dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencies-${{ github.sha }}
          path: |
            artifacts/*.json
            artifacts/audit-requirements.txt
          if-no-files-found: warn
          retention-days: 14

  postgres:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_DB: mdm
          POSTGRES_USER: mdm
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mdm -d mdm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --memory 1g
          --cpus 2
    env:
      MDM_DATABASE_URL: postgresql://mdm@127.0.0.1:5432/mdm
      MDM_TEST_DATABASE_URL: postgresql://mdm@127.0.0.1:5432/mdm_test
      MDM_RESTORE_DATABASE_URL: postgresql://mdm@127.0.0.1:5432/mdm_restore
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: mdm
      PGUSER: mdm
      PGPASSWORD: ci-ephemeral-only
      DBT_ENV_SECRET_PG_PASSWORD: ci-ephemeral-only
      PG_DUMP: ${{ github.workspace }}/.github/scripts/pg_dump
      PG_RESTORE: ${{ github.workspace }}/.github/scripts/pg_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Record runtime and create isolated qualification databases
        env:
          MDM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p artifacts
          chmod +x .github/scripts/pg_dump .github/scripts/pg_restore
          uv run --no-sync python - <<'PY'
          import json, os, platform
          from pathlib import Path
          from importlib.metadata import version
          import psycopg
          with psycopg.connect(os.environ["MDM_DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE DATABASE mdm_test")
              conn.execute("CREATE DATABASE mdm_restore")
              conn.execute("CREATE DATABASE mdm_load")
              server = conn.execute("SELECT version()").fetchone()[0]
          report = {
              "commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "python": platform.python_version(), "platform": platform.platform(), "postgres": server,
              "packages": {name: version(name) for name in ("dbt-core", "dbt-postgres", "dbt-snowflake", "psycopg", "fastapi")},
              "snowflake_live_executed": False,
          }
          Path("artifacts/environment.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("MDM_CI_POSTGRES_CONTAINER=" + os.environ["MDM_CI_POSTGRES_CONTAINER"] + "\n")
          PY
          docker image inspect postgres:17.12 --format '{{json .RepoDigests}}' > artifacts/postgres-image-digests.json
      - name: Lint executable code
        run: uv run --no-sync ruff check src tests scripts .github/scripts
      - name: Run unit and real PostgreSQL integration tests
        run: uv run --no-sync pytest -q --junitxml=artifacts/pytest.xml
      - name: Fail if any test was skipped
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("artifacts/pytest.xml").getroot()
          assert not root.findall(".//skipped"), "Skipped tests do not qualify an integration"
          PY
      - name: Execute the business demonstration
        run: |
          uv run --no-sync mdm migrate
          uv run --no-sync mdm demo --output artifacts/demo.json
          uv run --no-sync mdm check > artifacts/business-check.json
          uv run --no-sync mdm snapshot --output artifacts/postgres-snapshot.json
      - name: Validate the warehouse export against the real PostgreSQL schema
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg
          from mdm.snowflake import export_snapshot
          with psycopg.connect(os.environ["MDM_DATABASE_URL"]) as conn:
              conn.execute("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY")
              snapshot = export_snapshot(conn)
          report = {"snapshot_id": snapshot.snapshot_id, "counts": snapshot.counts,
                    "postgres_export_executed": True, "snowflake_load_executed": False}
          Path("artifacts/warehouse-export.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Execute dbt models, contracts and data tests
        run: |
          uv run --no-sync dbt deps --project-dir dbt --profiles-dir dbt --target postgres
          uv run --no-sync dbt build --project-dir dbt --profiles-dir dbt --target postgres --target-path ../artifacts/dbt-build
          uv run --no-sync dbt docs generate --project-dir dbt --profiles-dir dbt --target postgres --target-path ../artifacts/dbt-docs
      - name: Exercise consistent backup and restoration into an empty database
        run: |
          uv run --no-sync bash scripts/backup.sh artifacts/reference.dump --expect-db mdm
          uv run --no-sync bash scripts/restore.sh artifacts/reference.dump --expect-db mdm_restore --report artifacts/restore.json
      - name: Reject a second restore into the populated database
        run: |
          uv run --no-sync python - <<'PY'
          import json, subprocess
          from pathlib import Path

          directory = Path("artifacts")
          directory.mkdir(exist_ok=True)
          forbidden = directory / "forbidden-restore.json"
          stdout = directory / "second-restore.stdout.txt"
          stderr = directory / "second-restore.stderr.txt"
          returncode = None
          execution_error = None
          timed_out = False
          with stdout.open("wb") as output, stderr.open("wb") as errors:
              try:
                  process = subprocess.run(
                      ["bash", "scripts/restore.sh", "artifacts/reference.dump", "--expect-db", "mdm_restore",
                       "--report", str(forbidden)],
                      stdout=output, stderr=errors, timeout=60, check=False,
                  )
                  returncode = process.returncode
              except subprocess.TimeoutExpired:
                  timed_out = True
                  execution_error = "TimeoutExpired"
              except OSError as exc:
                  execution_error = type(exc).__name__
          response = None
          parse_error = None
          try:
              response = json.loads(stderr.read_bytes())
          except (json.JSONDecodeError, UnicodeDecodeError) as exc:
              parse_error = type(exc).__name__
          checks = {
              "exit_code_is_one": returncode == 1,
              "completed_within_timeout": not timed_out and execution_error is None,
              "restore_verified_is_false": isinstance(response, dict) and response.get("restore_verified") is False,
              "expected_error_type": isinstance(response, dict) and response.get("error_type") == "OperationError",
              "expected_reason": isinstance(response, dict) and response.get("reason") == "Restore target is not empty and isolated",
              "forbidden_report_absent": not forbidden.exists() and not forbidden.is_symlink(),
          }
          report = {
              "passed": all(checks.values()), "checks": checks, "returncode": returncode,
              "timeout_seconds": 60, "timed_out": timed_out, "execution_error": execution_error,
              "response": response, "parse_error": parse_error,
              "stdout_path": str(stdout), "stderr_path": str(stderr),
          }
          (directory / "second-restore-rejection.json").write_text(json.dumps(report, indent=2) + "\n")
          if not report["passed"]:
              raise SystemExit("Second restore did not fail for the expected populated-target reason; inspect retained evidence")
          PY
      - name: Validate restored business views with dbt
        env:
          PGDATABASE: mdm_restore
        run: uv run --no-sync dbt test --project-dir dbt --profiles-dir dbt --target postgres --target-path ../artifacts/dbt-restored
      - name: Measure a bounded control profile
        run: uv run --no-sync mdm benchmark --size 300 --output artifacts/benchmark-control.json
      - name: Measure database work, query plan and history growth
        env:
          MDM_DATABASE_URL: postgresql://mdm@127.0.0.1:5432/mdm_load
        run: uv run --no-sync mdm benchmark --size 300 --database --output artifacts/benchmark-database.json
      - name: Measure an explicitly requested load profile
        if: github.event_name == 'workflow_dispatch' && inputs.load_records != '0'
        env:
          MDM_LOAD_RECORDS: ${{ inputs.load_records }}
        run: |
          uv run --no-sync python - <<'PY'
          import os, subprocess
          size = int(os.environ["MDM_LOAD_RECORDS"])
          if not 100 <= size <= 10000:
              raise SystemExit("load_records must be 100..10000, or 0 to disable")
          subprocess.run(["mdm", "benchmark", "--size", str(size), "--output", "artifacts/benchmark-load.json"], check=True, timeout=180)
          PY
      - name: Retain original qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-evidence-${{ github.sha }}
          path: |
            artifacts/*.json
            artifacts/*.xml
            artifacts/second-restore.*.txt
            artifacts/dbt-build/manifest.json
            artifacts/dbt-build/run_results.json
            artifacts/dbt-build/compiled/
            artifacts/dbt-build/run/
            artifacts/dbt-docs/manifest.json
            artifacts/dbt-docs/run_results.json
            artifacts/dbt-docs/catalog.json
            artifacts/dbt-docs/compiled/
            artifacts/dbt-docs/run/
            artifacts/dbt-restored/
            dbt/logs/dbt.log
          if-no-files-found: warn
          retention-days: 14

  container:
    needs: [scope, postgres]
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: mdm-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MDM_SECRET_DIR: .secrets/ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the locked browser qualification environment
        run: |
          uv sync --frozen --extra browser
          uv run --no-sync python -m playwright install --with-deps --only-shell chromium
      - name: Create ephemeral file secrets
        run: python3 .github/scripts/setup_ci_secrets.py
      - name: Validate and build the reference deployment
        run: |
          docker compose config --quiet
          docker compose build
      - name: Start the reference deployment
        run: docker compose up --detach --wait --wait-timeout 120 api
      - name: Execute the demo through the installed image
        run: |
          mkdir -p artifacts
          docker compose exec -T api mdm demo > artifacts/container-demo.json
          docker compose exec -T api mdm check > artifacts/container-check.json
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/healthz > artifacts/container-health.json
          docker compose images --format json > artifacts/container-images.json
      - name: Qualify the rendered review, golden records and consumer views
        timeout-minutes: 3
        run: uv run --no-sync python scripts/browser_smoke.py
      - name: Retain deployment logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/container.log
      - name: Retain container evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this run's ephemeral deployment
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 30
