# Optional external monitoring configuration; no Prometheus service is auto-deployed.
# This target assumes Prometheus runs on the same host as the loopback API.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/mdm-alerts.yml

scrape_configs:
  - job_name: enterprise-mdm
    metrics_path: /metrics
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/mdm_metrics_token
    static_configs:
      - targets: ["127.0.0.1:8000"]
