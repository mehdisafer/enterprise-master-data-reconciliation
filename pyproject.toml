[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-master-data-reconciliation"
version = "0.1.0rc1"
description = "Explainable, reversible master-data decisions across industrial ERP systems"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.4",
  "uvicorn==0.52.1",
  "pydantic==2.14.3",
  "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
postgres = ["dbt-core==1.12.7", "dbt-postgres==1.11.0"]
snowflake = ["dbt-core==1.12.7", "dbt-snowflake==1.12.5", "snowflake-connector-python==4.8.1", "filelock>=4.2.1,<5"]
dev = ["pytest>=8.4,<10", "httpx==0.28.1", "ruff>=0.14,<1", "pip-audit>=2.9,<3", "pip-licenses>=5,<6"]
browser = ["playwright==1.65.1"]

[project.scripts]
mdm = "mdm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


[tool.uv]
# uv 0.13.6: verify the backend and editable-build dependencies as well as runtime packages.
require-build-hashes = true
build-constraint-dependencies = [
  { requirement = "editables==0.6", hashes = ["sha256:1163834902381c4613787951c5914800fdf155ae08848a373b8ea5006780977c", "sha256:d70e4698078a1d033e7786d9c64e5be070d058a67c21417024d38a58ac20aa43"] },
  { requirement = "hatchling==1.33.0", hashes = ["sha256:415290b84f464d2884303fca8974d38e7b85579069fab02a15db0828fbb1446d", "sha256:4c422bd4d554fcff5de5b73e9596f85e41e9f97f7e553d8f7595ecb31a627bef"] },
  { requirement = "packaging==26.3", hashes = ["sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79", "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
  { requirement = "pathspec==1.0.4", hashes = ["sha256:0210e2ae8a21a9137c0d470578cb0e595af87edaa6ebf12ff176f14a02e0e645", "sha256:fb6ae2fd4e7c921a165808a552060e722767cfa526f99ca5156ed2ce45a5c723"] },
  { requirement = "pluggy==1.7.0", hashes = ["sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec", "sha256:d1eaa46ebb595891b860ab086b4d09c8588af65ebd4361b8e8f4bb8920b90ba8"] },
