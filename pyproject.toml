[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-master-data-reconciliation"
version = "0.1.0rc1"
description = "Explainable, reversible master-data decisions across industrial ERP systems"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.4",
  "uvicorn==0.52.1",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
postgres = ["dbt-core==1.12.7", "dbt-postgres==1.11.0"]
snowflake = ["dbt-core==1.12.7", "dbt-snowflake==1.12.5", "snowflake-connector-python==4.8.1", "filelock>=4.2.1,<5"]
dev = ["pytest>=8.4,<10", "httpx==0.28.1", "ruff>=0.14,<1", "pip-audit>=2.9,<3", "pip-licenses>=5,<6"]
browser = ["playwright==1.65.1"]

[project.scripts]
mdm = "mdm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

